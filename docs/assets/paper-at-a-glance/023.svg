<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<rect width="1600" height="1000" fill="white"/>
<style>
.t{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#111}
.h{font-size:46px;font-weight:700}.sub{font-size:23px}.n{font-size:34px;font-weight:700}.lab{font-size:18px}
.sh{font-size:28px;font-weight:700}.box{fill:#f3f3f3;stroke:#222;stroke-width:2}.body{font-size:18px}.b{font-weight:700}
</style>
<text x="70" y="78" class="t h">023｜古代神话为什么会相似？</text>
<text x="72" y="122" class="t sub">不是先问“谁抄谁”，而是区分：共同祖源 · 历史传播 · 环境趋同 · 独立收敛</text>
<g>
<rect x="70" y="160" width="340" height="110" rx="10" class="box"/><text x="100" y="213" class="t n">24</text><text x="100" y="247" class="t lab">校准母题</text>
<rect x="440" y="160" width="340" height="110" rx="10" class="box"/><text x="470" y="213" class="t n">120</text><text x="470" y="247" class="t lab">双模型判断</text>
<rect x="810" y="160" width="340" height="110" rx="10" class="box"/><text x="840" y="213" class="t n">0.825</text><text x="840" y="247" class="t lab">四状态一致率</text>
<rect x="1180" y="160" width="340" height="110" rx="10" class="box"/><text x="1210" y="213" class="t n">0.894</text><text x="1210" y="247" class="t lab">二元 Cohen κ</text>
</g>
<text x="76" y="330" class="t sh">最有信息量的两个对照</text>
<rect x="70" y="365" width="715" height="158" rx="10" class="box"/>
<text x="105" y="412" class="t sub">Gilgamesh XI ↔ Genesis 6–9</text>
<text x="105" y="453" class="t body">6 个共同 present ｜ Jaccard = 0.857</text>
<text x="105" y="493" class="t body">→ 值得追传播链；但相似度本身不等于借鉴证据</text>
<rect x="815" y="365" width="715" height="158" rx="10" class="box"/>
<text x="850" y="412" class="t sub">Rigveda ↔ Hesiod</text>
<text x="850" y="453" class="t body">Simple matching = 0.875 ｜ Jaccard = 0.50</text>
<text x="850" y="493" class="t body">→ 6 个共同 absent 制造“假高相似”</text>
<text x="76" y="585" class="t sh">过程追踪给出的机制边界</text>
<text x="90" y="635" class="t body b">近东洪水</text><text x="300" y="635" class="t body">专业文学史 + 巴比伦接触机会支持 Mesopotamian literary-dependence family；具体中介仍未知</text>
<text x="90" y="700" class="t body b">中国治水</text><text x="300" y="700" class="t body">危险水环境可产生广义趋同，但“治水/秩序恢复”≠“灭世–方舟–重启人类”</text>
<text x="90" y="765" class="t body b">苏美尔–阿卡德造人</text><text x="300" y="765" class="t body">clay + labor 共享于双语书吏环境；支持共享文化库，不等于一篇文本直接抄另一篇</text>
<text x="90" y="830" class="t body b">印欧神战</text><text x="300" y="830" class="t body">比较诗学提供独立谱系证据；说明小型 motif Jaccard 不能单独裁决祖源</text>
<rect x="70" y="884" width="1460" height="70" rx="10" class="box"/>
<text x="800" y="929" text-anchor="middle" class="t sub b">核心结论：相似性是需要解释的观察结果，而不是传播本身的证据。QCA 当前保持 OFF。</text>
</svg>