name: ARIS4C019 Pilot-0 data gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'papers/019-time-off-happiness/code/pilot0_data_gate.py'
      - 'papers/019-time-off-happiness/code/pilot0_design_diagnostics.py'
      - 'papers/019-time-off-happiness/code/pilot0_covariate_gate.py'
      - 'papers/019-time-off-happiness/process/REFORM_CANDIDATES.csv'
      - '.github/workflows/aris4c019-data-gate.yml'

permissions:
  contents: write

concurrency:
  group: aris4c019-data-gate
  cancel-in-progress: true

jobs:
  data-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pandas requests openpyxl xlrd
      - name: Regenerate from latest main and publish atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "019 data-gate attempt $attempt"
            git fetch origin main
            git reset --hard origin/main

            python papers/019-time-off-happiness/code/pilot0_data_gate.py
            python papers/019-time-off-happiness/code/pilot0_design_diagnostics.py
            python papers/019-time-off-happiness/code/pilot0_covariate_gate.py

            git add \
              papers/019-time-off-happiness/data \
              papers/019-time-off-happiness/process/PILOT0_DATA_GATE.md \
              papers/019-time-off-happiness/process/PILOT0_EVENT_FREEZE.csv \
              papers/019-time-off-happiness/process/LEGAL_VERIFICATION_QUEUE.csv \
              papers/019-time-off-happiness/process/PILOT0_DESIGN_DIAGNOSTICS.md \
              papers/019-time-off-happiness/process/PILOT0_COVARIATE_GATE.md

            if git diff --cached --quiet; then
              echo "No generated changes"
              exit 0
            fi

            git commit -m "data(019): refresh Pilot-0 source coverage"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Concurrent update detected; regenerating from newest main."
          done

          echo "Failed to publish 019 data-gate artifacts after 3 attempts." >&2
          exit 1
