name: ARIS4C018 Pilot4 R2 Frozen Retinal

on:
  push:
    paths:
      - "papers/018-drosophila-neural-simulation/code/pilot4_r2_frozen_retinal.py"
      - "papers/018-drosophila-neural-simulation/code/pilot4_r2_compare.py"
      - ".github/workflows/aris4c018-pilot4-r2-frozen-retinal.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned legacy stack
        run: |
          python -m pip install "flygym-gymnasium[examples] @ git+https://github.com/NeLy-EPFL/flygym-gymnasium.git@d285260a1c8a7b3494150cd1590f2c9fe4b5e06b"
      - name: Download pretrained flyvis models
        run: flyvis download-pretrained --skip_large_files
      - name: Run frozen retinal vectors
        run: |
          python papers/018-drosophila-neural-simulation/code/pilot4_r2_frozen_retinal.py \
            --stack legacy --output /tmp/r2/legacy.json
      - uses: actions/upload-artifact@v4
        with:
          name: r2-legacy
          path: /tmp/r2/legacy.json

  current:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned current stacks
        run: |
          python -m pip install "git+https://github.com/NeLy-EPFL/flygym.git@38c8ec61034cd59bc5ba0de20688d4a3c0000d60"
          python -m pip install "git+https://github.com/TuragaLab/flyvis.git@92b3845cc426dd309a1a0e1b3890156c42e14021"
      - name: Download pretrained flyvis models
        run: flyvis download-pretrained --skip_large_files
      - name: Run frozen retinal vectors
        run: |
          python papers/018-drosophila-neural-simulation/code/pilot4_r2_frozen_retinal.py \
            --stack current --output /tmp/r2/current.json
      - uses: actions/upload-artifact@v4
        with:
          name: r2-current
          path: /tmp/r2/current.json

  compare:
    needs: [legacy, current]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy
      - uses: actions/download-artifact@v4
        with:
          name: r2-legacy
          path: /tmp/r2/legacy
      - uses: actions/download-artifact@v4
        with:
          name: r2-current
          path: /tmp/r2/current
      - name: Compare frozen-retinal outputs
        run: |
          python papers/018-drosophila-neural-simulation/code/pilot4_r2_compare.py \
            --legacy /tmp/r2/legacy/legacy.json \
            --current /tmp/r2/current/current.json \
            --output papers/018-drosophila-neural-simulation/data/pilot4_r2_frozen_retinal.json
      - name: Commit R2 diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/018-drosophila-neural-simulation/data/pilot4_r2_frozen_retinal.json
          git commit -m "ARIS4C018 freeze Pilot4 R2 frozen-retinal diagnostic"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
