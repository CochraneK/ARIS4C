name: ARIS4C018 Pilot4 Matched Cross Version

on:
  push:
    paths:
      - "papers/018-drosophila-neural-simulation/code/pilot4_legacy_matched_static.py"
      - "papers/018-drosophila-neural-simulation/code/pilot4_current_matched_static.py"
      - "papers/018-drosophila-neural-simulation/code/pilot4_compare_matched.py"
      - ".github/workflows/aris4c018-pilot4-matched-cross-version.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install EGL runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1-mesa-dev
      - name: Install pinned legacy stack
        run: |
          python -m pip install "flygym-gymnasium[examples] @ git+https://github.com/NeLy-EPFL/flygym-gymnasium.git@d285260a1c8a7b3494150cd1590f2c9fe4b5e06b"
      - name: Download pretrained flyvis models
        run: flyvis download-pretrained --skip_large_files
      - name: Run matched legacy condition
        env:
          MUJOCO_GL: egl
          PYOPENGL_PLATFORM: egl
        run: |
          python papers/018-drosophila-neural-simulation/code/pilot4_legacy_matched_static.py \
            --output /tmp/pilot4/legacy.json
      - uses: actions/upload-artifact@v4
        with:
          name: pilot4-legacy
          path: /tmp/pilot4/legacy.json
          if-no-files-found: error

  current:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install EGL runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1-mesa-dev
      - name: Install pinned current stacks
        run: |
          python -m pip install "git+https://github.com/NeLy-EPFL/flygym.git@38c8ec61034cd59bc5ba0de20688d4a3c0000d60"
          python -m pip install "git+https://github.com/TuragaLab/flyvis.git@92b3845cc426dd309a1a0e1b3890156c42e14021"
      - name: Download pretrained flyvis models
        run: flyvis download-pretrained --skip_large_files
      - name: Run matched current condition
        env:
          MUJOCO_GL: egl
          PYOPENGL_PLATFORM: egl
        run: |
          python papers/018-drosophila-neural-simulation/code/pilot4_current_matched_static.py \
            --output /tmp/pilot4/current.json
      - uses: actions/upload-artifact@v4
        with:
          name: pilot4-current
          path: /tmp/pilot4/current.json
          if-no-files-found: error

  compare:
    needs: [legacy, current]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: pilot4-legacy
          path: /tmp/pilot4/legacy
      - uses: actions/download-artifact@v4
        with:
          name: pilot4-current
          path: /tmp/pilot4/current
      - name: Compare pre-frozen engineering metrics
        run: |
          python papers/018-drosophila-neural-simulation/code/pilot4_compare_matched.py \
            --legacy /tmp/pilot4/legacy/legacy.json \
            --current /tmp/pilot4/current/current.json \
            --output papers/018-drosophila-neural-simulation/data/pilot4_matched_cross_version.json
      - name: Preserve side outputs
        run: |
          cp /tmp/pilot4/legacy/legacy.json papers/018-drosophila-neural-simulation/data/pilot4_legacy_matched_static.json
          cp /tmp/pilot4/current/current.json papers/018-drosophila-neural-simulation/data/pilot4_current_matched_static.json
      - name: Commit diagnostic outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            papers/018-drosophila-neural-simulation/data/pilot4_legacy_matched_static.json \
            papers/018-drosophila-neural-simulation/data/pilot4_current_matched_static.json \
            papers/018-drosophila-neural-simulation/data/pilot4_matched_cross_version.json
          if git diff --cached --quiet; then
            echo "Pilot4 outputs unchanged"
            exit 0
          fi
          git commit -m "ARIS4C018 freeze Pilot4 matched cross-version diagnostic"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
