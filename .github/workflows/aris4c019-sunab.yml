name: ARIS4C019 Sun-Abraham robustness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'papers/019-time-off-happiness/code/pilot0_sunab.py'
      - 'papers/019-time-off-happiness/process/PILOT0_UNLOCK.md'
      - '.github/workflows/aris4c019-sunab.yml'

permissions:
  contents: write

concurrency:
  group: aris4c019-sunab
  cancel-in-progress: true

jobs:
  sunab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pandas requests xlrd pyfixest==0.40.1
      - name: Run frozen Sun-Abraham robustness and publish atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "019 Sun-Abraham attempt $attempt"
            git fetch origin main
            git reset --hard origin/main

            test -f papers/019-time-off-happiness/process/PILOT0_UNLOCK.md
            python papers/019-time-off-happiness/code/pilot0_sunab.py

            git add \
              papers/019-time-off-happiness/data/pilot0_sunab_panel_manifest.csv \
              papers/019-time-off-happiness/data/pilot0_sunab_cohort_event.csv \
              papers/019-time-off-happiness/data/pilot0_sunab_period_aggregate.csv \
              papers/019-time-off-happiness/data/pilot0_sunab_heterogeneity_test.json \
              papers/019-time-off-happiness/process/PILOT0_SUNAB.md

            if git diff --cached --quiet; then
              echo "No generated changes"
              exit 0
            fi

            git commit -m "analysis(019): publish Sun-Abraham robustness"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Concurrent update detected; regenerating from newest main."
          done

          echo "Failed to publish 019 Sun-Abraham artifacts after 3 attempts." >&2
          exit 1
