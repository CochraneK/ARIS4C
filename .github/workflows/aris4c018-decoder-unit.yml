name: ARIS4C018 Decoder Unit

on:
  push:
    paths:
      - "papers/018-drosophila-neural-simulation/code/official_legacy_decoder.py"
      - "papers/018-drosophila-neural-simulation/tests/test_official_legacy_decoder.py"
      - ".github/workflows/aris4c018-decoder-unit.yml"
  pull_request:
    paths:
      - "papers/018-drosophila-neural-simulation/code/official_legacy_decoder.py"
      - "papers/018-drosophila-neural-simulation/tests/test_official_legacy_decoder.py"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy
      - run: python papers/018-drosophila-neural-simulation/tests/test_official_legacy_decoder.py
