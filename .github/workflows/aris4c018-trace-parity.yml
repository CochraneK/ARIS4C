name: ARIS4C018 Trace Parity

on:
  push:
    paths:
      - "papers/018-drosophila-neural-simulation/data/pilot2c_synchronized_trace.json"
      - "papers/018-drosophila-neural-simulation/data/pilot3c_current_synchronized_trace.json"
  pull_request:
    paths:
      - "papers/018-drosophila-neural-simulation/data/pilot2c_synchronized_trace.json"
      - "papers/018-drosophila-neural-simulation/data/pilot3c_current_synchronized_trace.json"

jobs:
  semantic-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python papers/018-drosophila-neural-simulation/tests/test_trace_parity.py
