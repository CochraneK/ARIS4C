name: ARIS4C018 Pilot0

on:
  push:
    paths:
      - "papers/018-drosophila-neural-simulation/code/**"
      - "papers/018-drosophila-neural-simulation/tests/**"
      - ".github/workflows/aris4c018-pilot0.yml"
  pull_request:
    paths:
      - "papers/018-drosophila-neural-simulation/code/**"
      - "papers/018-drosophila-neural-simulation/tests/**"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy
      - run: python papers/018-drosophila-neural-simulation/tests/test_pilot0_ring_attractor.py
