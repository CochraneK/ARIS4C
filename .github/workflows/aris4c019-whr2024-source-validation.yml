name: ARIS4C019 WHR2024 source validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'papers/019-time-off-happiness/code/validate_whr2024_mirror.py'
      - '.github/workflows/aris4c019-whr2024-source-validation.yml'

permissions:
  contents: write

concurrency:
  group: aris4c019-whr2024-source-validation
  cancel-in-progress: true

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pandas requests xlrd
      - name: Validate pinned WHR2024 annual mirror and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "019 WHR2024 source-validation attempt $attempt"
            git fetch origin main
            git reset --hard origin/main

            python papers/019-time-off-happiness/code/validate_whr2024_mirror.py

            git add \
              papers/019-time-off-happiness/data/whr2024_source_validation.json \
              papers/019-time-off-happiness/process/WHR2024_MIRROR_VALIDATION.md

            if git diff --cached --quiet; then
              echo "No generated changes"
              exit 0
            fi

            git commit -m "data(019): validate pinned WHR2024 annual mirror"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Concurrent update detected; regenerating from newest main."
          done

          echo "Failed to publish WHR2024 validation after 3 attempts." >&2
          exit 1
