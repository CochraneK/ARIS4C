name: ARIS4C018 Pilot2 Legacy Vision

on:
  push:
    paths:
      - "papers/018-drosophila-neural-simulation/code/pilot2_*.py"
      - "papers/018-drosophila-neural-simulation/PILOT2_LEGACY_ADVANCED_VISION_PLAN.md"
      - ".github/workflows/aris4c018-pilot2-legacy-vision.yml"
  workflow_dispatch:

jobs:
  realistic-vision-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned legacy FlyGym examples stack
        run: |
          python -m pip install "flygym-gymnasium[examples] @ git+https://github.com/NeLy-EPFL/flygym-gymnasium.git@d285260a1c8a7b3494150cd1590f2c9fe4b5e06b"
      - name: Download flyvis pretrained models
        run: flyvis download-pretrained --skip_large_files
      - name: Run embodied-neural interface smoke
        run: python papers/018-drosophila-neural-simulation/code/pilot2_legacy_realistic_vision_smoke.py
