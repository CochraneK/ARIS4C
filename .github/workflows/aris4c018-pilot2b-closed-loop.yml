name: ARIS4C018 Pilot2B Closed Loop

on:
  push:
    paths:
      - "papers/018-drosophila-neural-simulation/code/pilot2b_bounded_closed_loop.py"
      - ".github/workflows/aris4c018-pilot2b-closed-loop.yml"
  workflow_dispatch:

jobs:
  bounded-closed-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install EGL runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1-mesa-dev
      - name: Install pinned legacy FlyGym examples stack
        run: |
          python -m pip install "flygym-gymnasium[examples] @ git+https://github.com/NeLy-EPFL/flygym-gymnasium.git@d285260a1c8a7b3494150cd1590f2c9fe4b5e06b"
      - name: Download flyvis pretrained models
        run: flyvis download-pretrained --skip_large_files
      - name: Run bounded official closed loop
        env:
          MUJOCO_GL: egl
          PYOPENGL_PLATFORM: egl
        run: python papers/018-drosophila-neural-simulation/code/pilot2b_bounded_closed_loop.py
