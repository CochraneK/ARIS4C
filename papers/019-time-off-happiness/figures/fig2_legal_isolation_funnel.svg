<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<title>Legal-event isolation funnel</title>
<desc>Two-path discovery audit. Legacy World Bank leave jumps yielded no new clean holdouts after legal verification, while modern legal snapshot comparison yielded one clean Israel holdout and one future Mexico holdout.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>.t{font-family:Arial,Helvetica,sans-serif;fill:#111827}.muted{fill:#6b7280}.box{fill:#f9fafb;stroke:#d1d5db;stroke-width:2}.accent{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.future{fill:#fffbeb;stroke:#d97706;stroke-width:2}.arrow{stroke:#9ca3af;stroke-width:3;fill:none;marker-end:url(#m)}</style>
<defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#9ca3af"/></marker></defs>
<text x="80" y="58" class="t" font-size="30" font-weight="700">Legal treatment isolation sharply reduces apparent event supply</text>
<text x="80" y="92" class="t muted" font-size="18">Database discontinuities and snapshot changes are candidate generators, not treatments</text>

<text x="80" y="150" class="t" font-size="21" font-weight="700">Legacy World Bank path</text>
<rect x="80" y="180" width="270" height="100" rx="12" class="box"/>
<text x="215" y="218" class="t" font-size="28" font-weight="700" text-anchor="middle">44</text>
<text x="215" y="248" class="t muted" font-size="16" text-anchor="middle">historical leave jumps</text>
<line x1="350" y1="230" x2="430" y2="230" class="arrow"/>
<rect x="440" y="180" width="270" height="100" rx="12" class="box"/>
<text x="575" y="218" class="t" font-size="28" font-weight="700" text-anchor="middle">11</text>
<text x="575" y="246" class="t muted" font-size="16" text-anchor="middle">unregistered jumps with</text>
<text x="575" y="267" class="t muted" font-size="16" text-anchor="middle">usable WHR coverage</text>
<line x1="710" y1="230" x2="790" y2="230" class="arrow"/>
<rect x="800" y="180" width="300" height="100" rx="12" class="accent"/>
<text x="950" y="218" class="t" font-size="28" font-weight="700" text-anchor="middle">0</text>
<text x="950" y="248" class="t" font-size="16" text-anchor="middle">new clean leave-specific holdouts</text>

<text x="80" y="380" class="t" font-size="21" font-weight="700">Modern legal-snapshot path</text>
<rect x="80" y="410" width="270" height="110" rx="12" class="box"/>
<text x="215" y="448" class="t" font-size="28" font-weight="700" text-anchor="middle">193</text>
<text x="215" y="477" class="t muted" font-size="16" text-anchor="middle">countries in WORLD /</text>
<text x="215" y="498" class="t muted" font-size="16" text-anchor="middle">Equal Futures snapshots</text>
<line x1="350" y1="465" x2="430" y2="465" class="arrow"/>
<rect x="440" y="410" width="270" height="110" rx="12" class="box"/>
<text x="575" y="448" class="t" font-size="28" font-weight="700" text-anchor="middle">13</text>
<text x="575" y="477" class="t muted" font-size="16" text-anchor="middle">cross-category candidates</text>
<text x="575" y="498" class="t muted" font-size="16" text-anchor="middle">for legal verification</text>
<line x1="710" y1="465" x2="790" y2="465" class="arrow"/>
<rect x="800" y="390" width="300" height="90" rx="12" class="accent"/>
<text x="950" y="425" class="t" font-size="26" font-weight="700" text-anchor="middle">1 clean holdout now</text>
<text x="950" y="453" class="t" font-size="17" text-anchor="middle">Israel 2016</text>
<rect x="800" y="500" width="300" height="90" rx="12" class="future"/>
<text x="950" y="535" class="t" font-size="24" font-weight="700" text-anchor="middle">1 future holdout</text>
<text x="950" y="563" class="t" font-size="17" text-anchor="middle">Mexico 2023 · needs ≥2 post years</text>

<text x="80" y="680" class="t muted" font-size="16">Original frozen 8-event panel is preserved separately as a broader labour/time-off policy-package stress test.</text>
<text x="80" y="710" class="t muted" font-size="16">Core rule: legal verification precedes outcome inspection; event count is never increased by relaxing treatment-isolation criteria.</text>
</svg>