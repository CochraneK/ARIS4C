<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<title>Israel reference-year sensitivity</title>
<desc>Post-outcome diagnostic showing that the Israel holdout estimate changes materially under alternative pre-period baselines. The pre-frozen 2015 baseline is near zero while earlier and multi-year baselines are negative.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>.t{font-family:Arial,Helvetica,sans-serif;fill:#111827}.muted{fill:#6b7280}.grid{stroke:#d1d5db;stroke-width:1;stroke-dasharray:3 6}.zero{stroke:#111827;stroke-width:1.5}.diag{fill:#9ca3af}.primary{fill:#2563eb}</style>
<text x="300" y="54" class="t" font-size="30" font-weight="700">Israel estimate is materially reference-sensitive</text>
