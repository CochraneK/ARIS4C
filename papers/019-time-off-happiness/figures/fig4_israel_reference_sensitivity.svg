t x="948" y="422.5" width="3.3563697788703166" height="45" rx="5" class="primary"/><text x="963.3563697788703" y="454.9" class="t" font-size="17" text-anchor="start">+0.002</text><text x="280" y="544.9" class="t" font-size="18" text-anchor="end">2013–2015 mean</text><rect x="593.1938933082204" y="512.5" width="354.80610669177963" height="45" rx="5" class="diag"/><text x="581.1938933082204" y="544.9" class="t" font-size="17" text-anchor="end">-0.219</text><text x="280" y="634.9" class="t" font-size="18" text-anchor="end">2012–2015 mean</text><rect x="663.7506330445549" y="602.5" width="284.2493669554451" height="45" rx="5" class="diag"/><text x="651.7506330445549" y="634.9" class="t" font-size="17" text-anchor="end">-0.175</text><text x="705" y="738" class="t muted" font-size="16" text-anchor="middle">Full-post mean donor-adjusted gap</text>
